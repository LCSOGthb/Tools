checks:
    javascript: true

build:
    image: default-jammy
    nodes:
        analysis:
            commands:
                - checkout-code ~/build
                - cd ~/build
                - corepack enable
                - corepack prepare pnpm@latest-10 --activate
                - pnpm install --frozen-lockfile
            tests:
                override:
                    - js-scrutinizer-run
