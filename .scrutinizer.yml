checks:
    javascript: true

build:
    image: default-jammy

    environment:
        node: 20

    nodes:
        analysis:
            dependencies:
                override:
                    - npm install -g pnpm

            tests:
                override:
                    - export npm_config_user_agent="pnpm"
                    - pnpm install --frozen-lockfile
                    - pnpm run build
